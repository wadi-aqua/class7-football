<script>
(function(){
  var dataEl = document.getElementById('data');
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var toastEl = document.getElementById('toast');
  var state = JSON.parse(dataEl.textContent);
  var saved = JSON.stringify(state);
  var canEdit = (location.hash === '#admin'), editing = false, toastTimer = null;
  var saveBtn = null, boardEl = null;

  function h(tag, props){
    var e = document.createElement(tag);
    var p = props || {};
    for (var k in p){
      var v = p[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++){
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++){
        var c = kids[j];
        if (c == null) continue;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return e;
  }
  function ga(p){ return p.goals + p.assists; }
  function clean(v){ var n = Math.floor(Number(v)); return isFinite(n) ? Math.min(999, Math.max(0, n)) : 0; }
  function cmp(a, b){ return ga(b) - ga(a) || b.goals - a.goals || a.name.localeCompare(b.name); }
  function dirty(){ return JSON.stringify(state) !== saved; }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = ''; }, 3200);
  }
  function updateSaveBtn(){
    if (!saveBtn) return;
    saveBtn.disabled = !dirty();
    saveBtn.textContent = dirty() ? 'Download updated page' : 'No changes';
  }

  function renderBar(){
    bar.innerHTML = '';
    saveBtn = null;
    if (!canEdit) return;
    if (!editing){
      bar.append(h('button', {id:'btn-edit', class:'primary', onclick:function(){ editing = true; renderBar(); renderAll(); }}, 'Edit stats'));
    } else {
      saveBtn = h('button', {id:'btn-save', class:'primary', onclick:save}, 'No changes');
      bar.append(
        saveBtn,
        h('button', {id:'btn-done', onclick:function(){
          if (dirty() && !confirmDiscard){ confirmDiscard = true; toast('Changes not downloaded yet. Press Done again to discard them.'); return; }
          if (dirty()){ state = JSON.parse(saved); }
          confirmDiscard = false; editing = false; renderBar(); renderAll();
        }}, 'Done')
      );
      updateSaveBtn();
    }
  }
  var confirmDiscard = false;

  function renderAll(){
    app.innerHTML = '';
    var banners = [];
    if (state.sample) banners.push(h('p', {class:'banner'}, 'Example names and numbers. Real class stats replace these once they are entered.'));
    if (editing) banners.push(h('p', {class:'banner'}, 'Admin mode. Changes go live only after you download the updated page and upload it to your site, replacing the old index.html.'));
    boardEl = h('div', {class:'tablewrap'});
    app.append(h('div', {style:'display:flex;flex-direction:column;gap:18px'}, banners, boardEl, editing ? addForm() : null, footer()));
    renderBoard();
  }

  function footer(){
    var f = h('div', {class:'foot'}, h('span', {}, 'G/A = goals + assists. Equal G/A shares a rank.'));
    if (state.updated){
      f.append(h('span', {}, 'Updated ' + new Date(state.updated).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'})));
    }
    return f;
  }

  function addForm(){
    var input = h('input', {id:'new-name', class:'cell-input', type:'text', placeholder:'New player name', maxlength:'40', 'aria-label':'New player name'});
    function add(){
      var name = input.value.trim();
      if (!name) { input.focus(); return; }
      state.players.push({id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name:name, goals:0, assists:0});
      input.value = '';
      renderBoard(); updateSaveBtn(); input.focus();
    }
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); add(); } });
    return h('div', {id:'add'}, input, h('button', {id:'btn-add', onclick:add}, 'Add player'));
  }

  function renderBoard(){
    var list = state.players.slice().sort(cmp);
    var max = Math.max.apply(null, [1].concat(list.map(ga)));
    var prev = null, rank = 0;
    var head = h('tr', {},
      h('th', {class:'l'}, '#'),
      h('th', {class:'l'}, 'Player'),
      h('th', {}, 'Goals'),
      h('th', {}, 'Assists'),
      h('th', {}, 'G/A'),
      editing ? h('th', {}, '') : null
    );
    var body = h('tbody');
    if (!list.length){
      body.append(h('tr', {}, h('td', {colspan: editing ? 6 : 5, class:'empty l'}, canEdit ? 'No players yet. Choose Edit stats and add the first name.' : 'No players yet.')));
    }
    list.forEach(function(p, i){
      var s = ga(p);
      if (s !== prev){ rank = i + 1; prev = s; }
      var gaVal = h('span', {class:'v'}, String(s));
      var fill = h('span', {class:'fill', style:'width:' + Math.round(s / max * 100) + '%'});
      var tr = h('tr', {class: rank === 1 ? 'lead' : ''});
      tr.append(h('td', {class:'rank'}, String(rank)));
      if (editing){
        var nameIn = h('input', {class:'cell-input', type:'text', value:p.name, maxlength:'40', 'aria-label':'Player name', id:'n-' + p.id});
        nameIn.addEventListener('input', function(){ p.name = nameIn.value; updateSaveBtn(); });
        var gIn = numInput(p, 'goals', 'Goals for ' + p.name, 'g-' + p.id, gaVal);
        var aIn = numInput(p, 'assists', 'Assists for ' + p.name, 'a-' + p.id, gaVal);
        tr.append(h('td', {class:'name'}, nameIn), h('td', {class:'num'}, gIn), h('td', {class:'num'}, aIn));
        var del = h('button', {class:'del', 'aria-label':'Remove ' + p.name}, 'Remove');
        var armed = false;
        del.addEventListener('click', function(){
          if (!armed){ armed = true; del.textContent = 'Sure?'; setTimeout(function(){ armed = false; del.textContent = 'Remove'; }, 2500); return; }
          state.players = state.players.filter(function(x){ return x.id !== p.id; });
          renderBoard(); updateSaveBtn();
        });
        tr.addEventListener('focusout', function(e){
          if (!tr.contains(e.relatedTarget)) setTimeout(renderBoard, 0);
        });
        tr.append(h('td', {class:'ga'}, fill, gaVal));
        tr.append(h('td', {}, del));
      } else {
        tr.append(h('td', {class:'name'}, p.name), h('td', {class:'num'}, String(p.goals)), h('td', {class:'num'}, String(p.assists)), h('td', {class:'ga'}, fill, gaVal));
      }
      body.append(tr);
    });
    var table = h('table', {}, h('thead', {}, head), body);
    boardEl.innerHTML = '';
    boardEl.append(table);
  }

  function numInput(p, key, label, id, gaVal){
    var inp = h('input', {class:'cell-input', type:'number', min:'0', max:'999', step:'1', inputmode:'numeric', value:String(p[key]), 'aria-label':label, id:id});
    inp.addEventListener('input', function(){
      p[key] = clean(inp.value);
      gaVal.textContent = String(ga(p));
      updateSaveBtn();
    });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') inp.blur(); });
    return inp;
  }

  function save(){
    if (!dirty()) return;
    state.players = state.players.filter(function(p){ return p.name.trim(); });
    state.players.forEach(function(p){ p.name = p.name.trim(); });
    state.sample = false;
    state.updated = new Date().toISOString();
    dataEl.textContent = JSON.stringify(state).replace(/</g, '\\u003c');
    var root = document.documentElement.cloneNode(true);
    root.removeAttribute('data-theme');
    root.querySelector('#app').innerHTML = '';
    root.querySelector('#bar').innerHTML = '';
    var t = root.querySelector('#toast'); t.textContent = ''; t.className = '';
    var html = '<!doctype html>\n' + root.outerHTML;
    var blob = new Blob([html], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    saved = JSON.stringify(state);
    renderBoard();
    updateSaveBtn();
    toast('Downloaded index.html. Upload it to your site to publish.');
  }

  renderAll();
  renderBar();
  window.addEventListener('hashchange', function(){ location.reload(); });
})();
</script>
